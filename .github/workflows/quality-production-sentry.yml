name: Verificar entrega Sentry de portada
on:
  workflow_dispatch:
  pull_request:
    paths:
      - quality/verify-production-sentry.mjs
      - .github/workflows/quality-production-sentry.yml
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Enviar un evento sintético marcado como prueba
        run: node quality/verify-production-sentry.mjs
