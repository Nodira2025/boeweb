name: Vulnerabilidades nuevas en dependencias

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
